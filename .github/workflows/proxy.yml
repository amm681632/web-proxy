name: Web Proxy Server

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install http-server
      run: npm install -g http-server

    - name: Create proxy page
      run: |
        cat > index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="fa">
        <head>
            <meta charset="UTF-8">
            <title>پروکسی گیت‌هاب اکشنز</title>
            <style>
                body {
                    font-family: Tahoma, sans-serif;
                    max-width: 900px;
                    margin: 50px auto;
                    padding: 20px;
                    background: #0d1117;
                    color: #c9d1d9;
                }
                .box {
                    background: #161b22;
                    padding: 30px;
                    border-radius: 10px;
                    border: 1px solid #30363d;
                }
                input, button {
                    width: 100%;
                    padding: 12px;
                    margin: 10px 0;
                    border-radius: 6px;
                    border: 1px solid #30363d;
                    background: #0d1117;
                    color: white;
                    font-size: 16px;
                }
                button {
                    background: #238636;
                    cursor: pointer;
                    width: auto;
                }
                button:hover { background: #2ea043; }
                iframe {
                    width: 100%;
                    height: 500px;
                    border: 1px solid #30363d;
                    border-radius: 8px;
                    margin-top: 20px;
                    background: white;
                }
                .status {
                    color: #3fb950;
                    font-size: 14px;
                }
            </style>
        </head>
        <body>
            <div class="box">
                <h2>🌐 پروکسی روی گیت‌هاب</h2>
                <p>وضعیت: <span class="status">✅ سرور فعال است</span></p>
                <p>آدرس سایت را وارد کنید:</p>
                <input type="text" id="url" placeholder="youtube.com یا https://youtube.com">
                <button onclick="loadSite()">نمایش سایت</button>
                <iframe id="frame" src="about:blank"></iframe>
                <p style="font-size: 12px; color: #8b949e;">⚠️ فقط برای وبگردی معمولی</p>
            </div>
            <script>
                async function loadSite() {
                    let url = document.getElementById('url').value;
                    if (!url.startsWith('http')) url = 'https://' + url;
                    const frame = document.getElementById('frame');
                    try {
                        const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url));
                        const data = await res.json();
                        const doc = frame.contentWindow.document;
                        doc.open();
                        doc.write(data.contents);
                        doc.close();
                    } catch(e) {
                        frame.srcdoc = `<html><body style="color:red;padding:20px;">❌ خطا: ${e.message}</body></html>`;
                    }
                }
            </script>
        </body>
        </html>
        EOF

    - name: Start and expose server
      run: |
        # اجرای سرور
        nohup http-server -p 8080 --cors > server.log 2>&1 &
        sleep 3
        
        echo "🔄 در حال اتصال به سرویس تونل..."
        echo ""
        echo "=========================================="
        echo "✅ آدرس پروکسی شما:"
        echo ""
        
        # استفاده از serveo.net (معمولاً در ایران بازتر است)
        curl -s http://serveo.net -d "port=8080" 2>&1 | head -20
        
        echo ""
        echo "=========================================="
        echo "⏱ این لینک تا 6 ساعت فعال است"
        echo "📋 لینک بالا را کپی کنید و در مرورگر باز کنید"
        
        # نگه داشتن سرور
        sleep 6h
